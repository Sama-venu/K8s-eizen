---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysqldb
  replicas: 2
  selector:
    matchLabels:
      app: app-database
  template:
    metadata:
      labels:  
        app: app-database

    spec:
      containers:
        - name: dbcont-1 
          image: venusama/phpapp:dbimage   
          ports: 
            - containerPort: 3306
        


          envFrom: 
            - secretRef: 
                name: bankapp-dbsecret

          resources:
            requests:
              cpu: "100m"
              memory: "150Mi"
            limits:
              cpu: "150m"
              memory: "200Mi"  

          volumeMounts:
            - name:  pvc-1
              mountPath: /usr/share/nginx/html/


   volumeClaimTemplates:
        - metadata:
            name: pvc-1
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: gp2  
            resources:
              requests:
                storage: 2Gi  
